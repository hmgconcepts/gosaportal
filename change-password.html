<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Change Password</title><link rel="stylesheet" href="assets/css/style.css">    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">

    <link rel="canonical" href="./change-password.html">
    <meta property="og:url" content="./change-password.html">
    <meta name="twitter:card" content="summary_large_image">
</head><body><main style="max-width:560px;margin:60px auto;padding:20px"><div class="card"><h1>🔐 Set a New Password</h1><p id="pw-help">Enter a new password for your account. Use at least 8 characters, with a mix of letters, numbers and symbols.</p><div class="form-group"><label>New password</label><input id="pw1" class="form-input" type="password" minlength="8"></div><div class="form-group"><label>Confirm password</label><input id="pw2" class="form-input" type="password" minlength="8"></div><button class="btn btn-primary" onclick="changePw()">Update password</button> <a class="btn btn-outline" href="dashboard.html">Back</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script>
<script src="assets/js/license.js"></script>
<script src="assets/js/demo.js"></script><script>async function changePw(){const p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value;if(p1.length<8)return alert('Password must be at least 8 characters');if(p1!==p2)return alert('Passwords do not match');const sb=window.sb;if(!sb)return alert('Database not configured');const {error}=await sb.auth.updateUser({password:p1});if(error)return alert(error.message);alert('Password updated successfully. Please sign in with your new password.');await sb.auth.signOut();location.href='login.html';}</script><script>/* V10.2: password visibility toggle (standalone pages) */(function(){function en(i){if(i.dataset.scEye)return;i.dataset.scEye='1';var w=document.createElement('div');w.style.cssText='position:relative;display:block';i.parentNode.insertBefore(w,i);w.appendChild(i);var b=document.createElement('button');b.type='button';b.tabIndex=-1;b.textContent='👁';b.setAttribute('aria-label','Show/hide password');b.style.cssText='position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;opacity:.55;padding:2px 4px;line-height:1';b.onclick=function(){var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁';i.focus();};i.style.paddingRight='34px';w.appendChild(b);}function scan(){document.querySelectorAll('input[type=password]').forEach(en);}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',scan);else scan();})();</script></body></html>
