<script>
/* ===================================================================
   CBT Exam Runner v15 — Final Stable
   - Multi-subject tabs (UTME-style) always appear when the question
     bank contains per-question section/subject metadata
   - Per-subject progress counters (answered/total)
   - Subject-aware previous/next within current subject
   - Defensive against missing fields, bad question banks, lost Supabase
     - Anonymous + registered candidates
     - Anti-cheat with watermark, focus loss, copy/paste blocks
     - Robust submit with 6 retries and a pending-queue fallback
   =================================================================== */
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const FREE_TYPES_NO_OPTIONS = ['short','short_answer','numeric','essay','code','cloze','multinumeric','fill_blank','math_equation','fill'];

  function toast(m, t, ms) {
    if (window.toast) return window.toast(m, t, ms);
    // Fallback: use the global toast from app.js if loaded
    if (window.Notifications && window.Notifications.showInApp) { window.Notifications.showInApp(m, '', t); return; }
    if (t === 'danger' || t === 'warning') console.warn('[toast]', m);
  }

  function openModal(){}
  function closeModal(){}

  /* School identity is available before login from generated config.js. The
     public exam RPC may return a newer, safe subset from school_settings; those
     values win without exposing any private configuration. */
  function applySchoolIdentity(remoteSchool){
    const cfg = window.SCHOOL || {};
    const db = remoteSchool && typeof remoteSchool === 'object' ? remoteSchool : {};
    const dbName=String(db.name||db.school_name||'').trim(),usableDbName=dbName&&!/^(my school|school|school portal)$/i.test(dbName)?dbName:'';
    const school = {
      name: usableDbName || cfg.name || dbName || 'School',
      motto: db.motto || cfg.motto || 'Excellence in Education',
      address: db.address || cfg.address || '',
      phone: db.phone || cfg.phone || '',
      email: db.email || cfg.email || '',
      logo: db.logo_url || cfg.logoUrl || cfg.logo_url || ('assets/img/logo.' + (cfg.logoExt || 'svg')),
      primary: (cfg.theme && cfg.theme.primary) || cfg.primary || '#0506ae',
      accent: (cfg.theme && cfg.theme.accent) || cfg.accent || '#964eec'
    };
    document.documentElement.style.setProperty('--sc-primary', school.primary);
    document.documentElement.style.setProperty('--sc-accent', school.accent);
    const set = (id, value) => { const el=$(id); if(el) el.textContent=value; };
    set('exam-school-name', school.name);
    set('exam-school-name-banner', school.name);
    set('exam-school-motto', school.motto);
    const contact = [school.address, school.phone ? 'Tel: '+school.phone : '', school.email].filter(Boolean).join(' · ');
    set('exam-school-contact', contact || 'Official school CBT examination portal');
    const logo=$('exam-school-logo');
    if(logo){
      logo.onerror=function(){ if(!this.dataset.fallback){this.dataset.fallback='1';this.src='assets/img/logo.png';}else{this.style.display='none';} };
      logo.src=school.logo;
      logo.alt=school.name+' logo';
    }
    document.title='Take Exam • '+school.name;
    return school;
  }
  applySchoolIdentity();

  /* ---------- State ---------- */
  const Exam = {
  /* V12.72 (item 4) — an honest countdown. It is derived from the server's
     own start time, so a learner who changes their device clock gains nothing. */
  countdownText(ms){
    if(!(ms>0)) return 'Opening now…';
    const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor((s%86400)/3600),
          m=Math.floor((s%3600)/60), sec=s%60;
    if(d>0) return d+'d '+h+'h '+m+'m';
    if(h>0) return h+'h '+m+'m '+sec+'s';
    if(m>0) return m+'m '+sec+'s';
    return sec+'s';
  },
  startCountdown(ms){
    if(this._cdTimer) clearInterval(this._cdTimer);
    const started=Date.now();
    this._cdTimer=setInterval(()=>{
      const left=ms-(Date.now()-started);
      const el=document.getElementById('cbt-countdown');
      if(!el){ clearInterval(this._cdTimer); this._cdTimer=null; return; }
      if(left<=0){
        clearInterval(this._cdTimer); this._cdTimer=null;
        el.textContent='Opening now…';
        /* unlock by itself — the learner does not have to know to reload */
        this.reload();
        return;
      }
      el.textContent=this.countdownText(left);
    },1000);
  },
  reload(){
    if(this._cdTimer){ clearInterval(this._cdTimer); this._cdTimer=null; }
    try{
      const code=new URLSearchParams(location.search).get('code')||'';
      if(code) location.href='./cbt-exam.html?code='+encodeURIComponent(code);
      else location.reload();
    }catch(_){ location.reload(); }
  },
    data: null,
    answers: [],
    idx: 0,
    timer: null,
    deadline: 0,
    /* V12.84 — a phone call is not a submission. While the page is away the
       countdown is paused, the answers are written to the device, and the time
       the interruption took is handed back when the candidate returns. */
    pausedAt: 0,
    /* V12.84 — THE PHONE'S CLOCK IS NOT THE SCHOOL'S CLOCK.
       A paper taken at home is timed by whatever clock the device has, and a
       phone that is four minutes fast closes a ninety-minute paper four minutes
       early. The exam reader already returns `server_now`; we anchor to it once
       at the start of the sitting and use it for every deadline calculation. */
    serverSkew: 0,
    interruptTotalMs: 0,
    interruptLog: [],
    _awayFlagged: false,
    _timeUpShown: false,
    monitor: null,
    flags: {},
    startTs: 0,
    violations: 0,
    violationLog: [],
    student: null,
    clientRef: '',
    school: null,
    _done: false,
  };

  /* V12.60 — a flag can carry a one-line reason. It is optional; a plain
     tap still records the flag so the tutor sees the question in the
     review queue. */
  Exam.toggleFlag = function(i){
    i = Number(i);
    this.flags = this.flags || {}; this.flagNotes = this.flagNotes || {};
    const next = !this.flags[i];
    this.flags[i] = next;
    if (!next) { delete this.flagNotes[i]; this.render(); return; }
    const q = this.qs()[i] || {};
    const label = 'Q' + (i + 1) + (q.subject || q.section ? ' · ' + (q.subject || q.section) : '');
    let note = '';
    try {
      note = window.prompt(label + ' — why are you flagging this question?\n(e.g. "two correct options", "image did not load", "typo", "not in the syllabus")\n\nLeave blank to flag without a note.', '') || '';
    } catch (_) { note = ''; }
    if (note.trim()) this.flagNotes[i] = note.trim().slice(0, 240);
    this.render();
    if (window.toast) toast('🚩 Flagged for your tutor' + (note.trim() ? ' — "' + note.trim().slice(0,60) + '"' : '') + '. Keep answering; flagged questions are reviewed after marking.', 'success', 5000);
  };
  Exam.qs = function(){ return (this.data && (this.data._questions || this.data.questions || this.data.csv_data)) || []; };
  Exam.param = function(){
    const u = new URLSearchParams(location.search);
    return (u.get('code') || u.get('exam') || u.get('c') || '').toUpperCase().trim();
  };
  Exam.root = function(){ return document.getElementById('exam-root'); };

  // ENTERPRISE V13 / V5: robust UTME-style multi-subject experience.
  /* ---------- Subject tab logic ---------- */
  Exam.subjectOf=function(q){

    if (!q) return 'General';
    if (q.section) return String(q.section);
    if (q.subject) return String(q.subject);
    if (q.subject_section) return String(q.subject_section);
    if (q.exam_subject) return String(q.exam_subject);
    // Fall back to subject_breakdown metadata
    const bd = ((this.data && this.data.anti_cheat_config && this.data.anti_cheat_config.subject_breakdown) || []);
    const oi = Number(q && q._orig_index != null ? q._orig_index : -1);
    if (oi >= 0 && bd.length > 1) {
      for (const b of bd) {
        const start = Number(b.start) || 0;
        const end = b.end != null ? Number(b.end) : (start + (Number(b.count) || 0) - 1);
        if (oi >= start && oi <= end) return b.name || 'General';
      }
    }
    return 'General';
  };

  Exam.sections=function(){
    const seen = []; const add = (s) => { const v = String(s || '').trim(); if (v && !seen.includes(v)) seen.push(v); };
    const bd = ((this.data && this.data.anti_cheat_config && this.data.anti_cheat_config.subject_breakdown) || []);
    if (Array.isArray(bd) && bd.length > 1) bd.forEach(b => add(b.name));
    this.qs().forEach(q => add(this.subjectOf(q)));
    return seen.length ? seen : ['General'];
  };

  Exam.currentSubject=function(){
    const q = this.qs()[this.idx];
    return this.subjectOf(q || { section: 'General' });
  };

  Exam.indexesForSubject=function(sec){
    const out = [];
    this.qs().forEach((q, i) => { if (this.subjectOf(q) === sec) out.push(i); });
    return out;
  };

  /* V10.3: array/structured answers (matching, ordering, grids…) must count
     as "answered" — String([]).trim() !== '' was true for ['',''] and false
     for a real [] pick list, so meters miscounted. One shared checker now. */
  Exam.hasAnswer=function(v){
    if (window.CBTTypes && CBTTypes.isBlank) return !CBTTypes.isBlank(v);
    return v != null && String(v).trim() !== '';
  };

  Exam.sectionStats=function(sec){
    let t = 0, a = 0;
    this.qs().forEach((q, i) => {
      if (this.subjectOf(q) === sec) {
        t++;
        if (this.hasAnswer(this.answers[i])) a++;
      }
    });
    return { t, a };
  };

  /* V10.3: refresh tab counters + palette states WITHOUT re-rendering the
     whole card. A full render would rebuild the drag list / chips under the
     candidate's finger on every keystroke. */
  Exam.refreshMeters=function(){
    const current = this.currentSubject();
    this.root().querySelectorAll('.cbt-subject-tabs button').forEach(btn => {
      const sec = decodeURIComponent(btn.dataset.sec || '');
      const st = this.sectionStats(sec);
      const span = btn.querySelector('span');
      if (span) span.textContent = '(' + st.a + '/' + st.t + ')';
    });
    this.root().querySelectorAll('.q-palette button').forEach(btn => {
      const i = Number(btn.dataset.i);
      btn.className = i === this.idx ? 'current' : (this.hasAnswer(this.answers[i]) ? 'answered' : (this.flags[i] ? 'flagged' : ''));
    });
  };

  Exam.goSubject=function(sec){
    const i = this.qs().findIndex(q => this.subjectOf(q) === sec);
    if (i >= 0) { this.idx = i; this.render(); }
  };

  Exam.nextInSubject=function(){
    const list = this.indexesForSubject(this.currentSubject());
    const p = list.indexOf(this.idx);
    if (p >= 0 && p < list.length - 1) { this.idx = list[p + 1]; this.render(); }
  };
  Exam.prevInSubject=function(){
    const list = this.indexesForSubject(this.currentSubject());
    const p = list.indexOf(this.idx);
    if (p > 0) { this.idx = list[p - 1]; this.render(); }
  };

  // v2: renderTabs=function — multi-subject CBT tab renderer
  Exam.renderTabs=function(current){
    const secs = this.sections();
    if (secs.length <= 1) return '';
    return '<div class="cbt-subject-tabs">' + secs.map(sec => {
      const st = this.sectionStats(sec);
      const key = encodeURIComponent(sec);
      const isActive = sec === current;
      return '<button type="button" class="btn ' + (isActive ? 'btn-primary' : 'btn-outline') + '" data-sec="' + esc(key) + '" style="font-weight:800;background:' + (isActive ? 'linear-gradient(135deg,#0506ae,#964eec);color:white;border:0' : 'white;color:#0506ae;border:1px solid #0506ae') + '">' + esc(sec) + ' <span style="font-size:.68rem;opacity:.85">(' + st.a + '/' + st.t + ')</span></button>';
    }).join('') + '</div>';
  };

  Exam.renderPalette=function(current){
    let localNo = 0;
    return '<div class="q-palette"><div class="label">' + esc(current) + ' — question map</div>' + this.qs().map((qq, i) => {
      if (this.subjectOf(qq) !==current) return '';
      localNo++;
      const cls = i === this.idx ? 'current' : (this.hasAnswer(this.answers[i]) ? 'answered' : (this.flags[i] ? 'flagged' : ''));
      return '<button type="button" class="' + cls + '" data-i="' + i + '" title="' + esc(current) + ' question ' + localNo + '">' + localNo + '</button>';
    }).join('') + '</div>';
  };

  Exam.render=function(){
    const FREE_TYPES_NO_OPTIONS = ['short','short_answer','numeric','essay','code','cloze','multinumeric','fill_blank','math_equation','fill'];
    const q = this.qs()[this.idx];
    if (!q) return;
    const current = this.currentSubject();
    const subjectIndexes = this.indexesForSubject(current);
    const localPos = subjectIndexes.indexOf(this.idx);
    const localNo = localPos + 1;
    const qType = String(q.type || 'mcq').toLowerCase();
    /* V10.3 (Tutoring Connect parity): structured question types — matching,
       ordering, sort-into-groups, grid, hot-text, multi-part numeric,
       multi-blank cloze, plus purpose-built numeric / short-answer / essay /
       code controls — render through the advanced engine in cbt-types.js.
       Everything else keeps the original letter-card / textarea path, so no
       existing paper changes behaviour. */
    const advanced = !!(window.CBTTypes && CBTTypes.handles && CBTTypes.handles(q));
    const advName = 'scq-' + this.idx;
    const advHTML = advanced ? CBTTypes.render(q, advName) : '';
    const hasOptions = !advanced && (q.options || []).length > 0 && !FREE_TYPES_NO_OPTIONS.includes(qType);
    const isMultiSelect = qType === 'multi_select';
    const selectedValues = Array.isArray(this.answers[this.idx]) ? this.answers[this.idx] : (this.answers[this.idx] == null ? [] : [String(this.answers[this.idx])]);

    const opts = hasOptions ? (q.options || []).map((o, i) => {
      const L = String.fromCharCode(65 + i);
      const checked = selectedValues.includes(L);
      return '<label class="option-label' + (checked ? ' selected' : '') + '" data-option="' + L + '"><input type="' + (isMultiSelect ? 'checkbox' : 'radio') + '" name="opt" value="' + L + '" ' + (checked ? 'checked' : '') + ' style="display:none"><span class="option-letter">' + L + '</span><span class="option-text">' + (window.CBTRich ? CBTRich.html(o) : esc(o)) + '</span></label>';
    }).join('') : '';

    const existingText = Array.isArray(this.answers[this.idx]) ? this.answers[this.idx].join(', ') : (this.answers[this.idx] || '');
    const free = (!hasOptions && !advanced) ? '<textarea class="form-input" rows="3" placeholder="Type your answer here">' + esc(existingText) + '</textarea>' : '';
    /* Assertion/Reason stems (kept on the classic option-card path) show the
       assertion + reason briefing block above the options. */
    const arBlock = (!advanced && window.CBTTypes && ['assertion_reason','ar'].includes(qType.replace(/[\s\/\\-]+/g,'_'))) ? CBTTypes.arBlock(q) : '';
    const passage = q.passage ? '<div class="notice" style="background:#f8fafc;border-color:#cbd5e1;color:#334155"><strong>Passage / Case:</strong><br>' + (window.CBTRich ? CBTRich.html(q.passage) : esc(q.passage)) + '</div>' : '';
    const media = q.media_url ? (/\.(mp3|wav|ogg|m4a)(\?|$)/i.test(q.media_url) ? '<audio controls style="width:100%;margin:8px 0" src="'+esc(q.media_url)+'"></audio>' : (/\.(mp4|webm|mov)(\?|$)/i.test(q.media_url) ? '<video controls style="max-width:100%;max-height:360px;margin:8px auto;display:block" src="'+esc(q.media_url)+'"></video>' : '<img src="'+esc(q.media_url)+'" alt="Question media" style="max-width:100%;max-height:360px;object-fit:contain;margin:8px auto;display:block" referrerpolicy="no-referrer">')) : '';
    const m = Math.floor(this.remaining / 60), ss = this.remaining % 60;
    const urgent = this.remaining <= 60;

    const html = '<div class="card">' +
      '<div class="exam-context" aria-label="Current examination details">' +
        '<span>Examination<b>'+esc((this.data&&this.data.title)||'CBT Examination')+'</b></span>' +
        '<span>Candidate<b>'+esc((this.student&&this.student.name)||'Anonymous')+'</b></span>' +
        '<span>Class<b>'+esc((this.student&&this.student.class)||(this.data&&this.data.class)||'—')+'</b></span>' +
        '<span>Term / Session<b>'+esc([this.data&&this.data.term,this.data&&this.data.session].filter(Boolean).join(' · ')||'—')+'</b></span>' +
      '</div>' +
      this.renderTabs(current) +
      (Number(this.data&&this.data.negative_mark)>0 ? '<div class="notice" style="background:#fff7ed;border-color:#fed7aa;color:#92400e;margin-bottom:10px"><b>⚠️ Negative marking:</b> -'+Number(this.data.negative_mark)+' per wrong answer — unanswered counts as 0, not negative. Choose carefully.</div>' : '') +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">' +
        '<strong>' + esc(current) + ' · Q ' + localNo + ' / ' + subjectIndexes.length + ' <span style="color:#64748b;font-weight:600">(overall ' + (this.idx + 1) + ' / ' + this.qs().length + ')</span></strong>' +
        '<div><span class="clock' + (urgent ? ' urgent' : '') + '" id="clock">' + m + ':' + String(ss).padStart(2, '0') + '</span> <span id="viol" class="viol"></span></div>' +
      '</div>' +
      passage + media + arBlock +
      ((advanced && window.CBTTypes && CBTTypes.canonical(q.type) === 'cloze')
        ? '<p style="font-size:.85rem;color:#64748b;margin:0 0 8px">Fill the gaps below' + (q.mark ? ' <span style="color:#64748b;font-size:.85rem">[' + q.mark + ' mark' + (q.mark > 1 ? 's' : '') + ']</span>' : '') + '</p>'
        : '<p style="font-size:1.05rem;margin:0 0 12px;line-height:1.5">' + (window.CBTRich ? CBTRich.html(q.question || '(no question text)') : esc(q.question || '(no question text)')) + (q.mark ? ' <span style="color:#64748b;font-size:.85rem">[' + q.mark + ' mark' + (q.mark > 1 ? 's' : '') + ']</span>' : '') + '</p>') +
      (isMultiSelect && !advanced ? '<p style="font-size:.78rem;color:#475569;margin:-4px 0 8px">Select every correct option.</p>' : '') +
      (advanced ? '<div id="scq-holder">' + advHTML + '</div>' : opts + free) +
      '<div class="actions">' +
        '<button type="button" class="btn btn-outline" data-act="prev-in" ' + (localPos <= 0 ? 'disabled' : '') + '>← Prev in ' + esc(current) + '</button>' +
        '<button type="button" class="btn btn-outline" data-act="flag">' + (this.flags[this.idx] ? '🚩 Unflag' : '🚩 Flag') + '</button>' +
        (window.CBTTypes ? '<button type="button" class="btn btn-outline" data-act="legend" title="How each question style works — does not use exam time">❓ How to answer</button>' : '') +
        (localPos < subjectIndexes.length - 1
          ? '<button type="button" class="btn btn-primary" data-act="next-in">Next in ' + esc(current) + ' →</button>'
          : '<button type="button" class="btn btn-outline" disabled>End of ' + esc(current) + '</button>') +
        '<button type="button" class="btn btn-primary" data-act="submit">Submit Exam ✓</button>' +
      '</div>' +
      this.renderPalette(current) +
    '</div>';

    this.root().innerHTML = html;
    // V12.42: Bind floating toolbar only during actual CBT (not entry), respecting per-exam toggles
    try{ if(this.data && this.qs().length && !this._done) CBT.bindFloatingToolbar(); else CBT.destroyFloatingToolbar(); }catch(_){}

    /* V10.8 (#3): READ-ALOUD (Adewale Classroom parity + Nigerian languages).
       A 🔊 Read-aloud bar mounts under the exam header: candidate-initiated,
       per-question, reads question + options via the device's free Web
       Speech voices (never the answer key), auto-cancels on question change/
       submit/tab-blur. School Connect extension: Yorùbá, Igbo and Hausa
       papers are DETECTED from their orthography and read with a matching
       device voice (or the closest African-English voice, with a tip to
       install the language pack). Maths is spoken via CBTRich.plain so
       \\frac{3x+6}{9} reads naturally. */
    try {
      if (window.CBTSpeech && CBTSpeech.available()) {
        CBTSpeech.stop();                       // never let audio leak across questions
        const card = this.root().querySelector('.card');
        const anchorEl = card ? card.querySelector('.actions') : null;
        if (card) {
          const host = document.createElement('div');
          host.className = 'sc-speech-host';
          if (anchorEl) card.insertBefore(host, anchorEl); else card.appendChild(host);
          CBTSpeech.mount(host, { getQuestion: () => this.qs()[this.idx] });
        }
      }
    } catch(_) {}

    /* V10.3: wire the advanced control — restore any saved answer, activate
       drag/chips/word-count behaviour, and stream every change into the
       standard answer store so drafts, palettes and submission all keep
       working identically. */
    if (advanced && window.CBTTypes) {
      try { CBTTypes.injectStyles(); } catch(_) {}
      const holder = this.root().querySelector('#scq-holder');
      if (holder) {
        CBTTypes.restore(q, advName, holder, this.answers[this.idx]);
        CBTTypes.activate(holder, () => {
          const v = CBTTypes.collect(q, advName, holder);
          this.answers[this.idx] = CBTTypes.isBlank(v) ? null : v;
          this.saveDraft();
          this.refreshMeters();
        });
      }
    }

    // Wire up the buttons
    if (this.root().querySelectorAll) this.root().querySelectorAll('.option-label').forEach((label) => {
      label.addEventListener('click', (event) => {
        event.preventDefault();
        const L = label.dataset.option;
        if (isMultiSelect) {
          const next = Array.isArray(this.answers[this.idx]) ? this.answers[this.idx].slice() : [];
          const at = next.indexOf(L); if (at >= 0) next.splice(at, 1); else next.push(L);
          next.sort(); this.answer(next);
        } else this.answer(L);
        // Re-render to update selected state and the per-subject progress badge.
        this.render();
      });
    });
    if (this.root().querySelectorAll) {
      this.root().querySelectorAll('.q-palette button').forEach(btn => {
        btn.addEventListener('click', () => { this.idx = Number(btn.dataset.i); this.render(); });
      });
      this.root().querySelectorAll('.cbt-subject-tabs button').forEach(btn => {
        btn.addEventListener('click', () => { this.goSubject(decodeURIComponent(btn.dataset.sec)); });
      });
      this.root().querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
          const a = btn.dataset.act;
          if (a === 'prev-in') this.prevInSubject();
          else if (a === 'next-in') this.nextInSubject();
          else if (a === 'flag') { this.toggleFlag(this.idx); }
          else if (a === 'legend') this.showLegend();
          else if (a === 'submit') this.confirmSubmit();
        });
      });
      const ta = this.root().querySelector('textarea');
      if (ta) ta.addEventListener('input', () => this.answer(ta.value));
    }
    // V12.17: JAMB-style keyboard shortcuts A-D, N, P, arrow keys, R, S (from hmgacademycbtsystem)
    // Robust, all-inclusive, self-contained, seamless — speed practice for UTME
    try{
      if(!this._keysBound){
        this._keysBound=true;
        const keyHandler=(e)=>{
          if(this._done) return;
          const active=document.activeElement;
          if(active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.isContentEditable)) return;
          const key=String(e.key||'').toUpperCase();
          if(['A','B','C','D'].includes(key)){
            const labels=this.root().querySelectorAll('.option-label');
            const idx=['A','B','C','D'].indexOf(key);
            if(labels[idx]){
              labels[idx].click();
              e.preventDefault();
            }
          }else if(key==='N' || e.key==='ArrowRight'){
            const btn=this.root().querySelector('[data-act="next-in"]');
            if(btn && !btn.disabled){ this.nextInSubject(); e.preventDefault(); }
          }else if(key==='P' || e.key==='ArrowLeft'){
            const btn=this.root().querySelector('[data-act="prev-in"]');
            if(btn && !btn.disabled){ this.prevInSubject(); e.preventDefault(); }
          }else if(key==='R'){
            this.toggleFlag(this.idx);
            this.render();
            e.preventDefault();
          }else if(key==='S'){
            if(confirm('Submit exam now? (S shortcut)')) this.confirmSubmit();
            e.preventDefault();
          }
        };
        document.addEventListener('keydown', keyHandler);
        this._keyHandler=keyHandler;
      }
    }catch(_){}
  };

  Exam.answer = function(v){
    this.answers[this.idx] = v;
    this.saveDraft();
  };

  /* V10.3: the "❓ How to answer" legend — every question style explained in
     student language, openable at any time without costing exam time. */
  Exam.showLegend = function(){

    if (overlay) { overlay.remove(); return; }

    overlay.innerHTML = '<div style="background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">' +
      '<h2 style="margin:0;font-size:1.1rem">❓ How each question style works</h2>' +
      '<button type="button" class="btn btn-sm btn-outline" id="scq-legend-close">× Close</button></div>' +
      CBTTypes.legendHTML() + '</div>';

  Exam.saveDraft = function(){
    try {
      const keyed = this.qs().map((q,i) => ({ index:(q._orig_index != null ? q._orig_index : i), answer:this.answers[i] }));
      const current = this.qs()[this.idx] || {};
      // V12.37: draft per student (CODE + admission) to prevent cross-student leakage on shared laptop
      const draftKey = 'cbt-draft-' + String(this.data && this.data.code || '').toUpperCase().replace(/[^A-Z0-9]/g,'') + '-' + String(this.student && this.student.id_ref || 'anon').toUpperCase().replace(/[^A-Z0-9]/g,'');
      localStorage.setItem(draftKey, JSON.stringify({ version:2, answers:keyed, index:(current._orig_index != null ? current._orig_index : this.idx), client_ref:this.clientRef, student_ref: this.student && this.student.id_ref || '', t:Date.now() }));
      // Also keep legacy key for backward compat (will be cleaned on submit)
      try{ localStorage.setItem('cbt-draft-' + (this.data && this.data.code), JSON.stringify({ version:2, answers:keyed, index:(current._orig_index != null ? current._orig_index : this.idx), client_ref:this.clientRef, t:Date.now() })); }catch(_){}
      /* V12.84 — a full or blocked device store used to fail in silence, and the
         learner discovered it only when a call cost them their answers. */
      this._draftSavedAt = Date.now();
    } catch(e) {
      if (!this._storageWarned) {
        this._storageWarned = true;
        try { toast('⚠ This device will not let the page save your answers locally (storage full or blocked). Keep this page open until you press Send — do not switch apps for long, and ask the exam officer for help if the phone is short of space.', 'danger', 20000); } catch(_) {}
      }
    }
  };

  /* V12.84 — ONE SITTING PER DEVICE.
     Two tabs of the same paper on one phone (a very common accident: the learner
     taps the link twice) both run a clock and both submit, so the second attempt
     overwrites the first and an honest candidate can be recorded with a worse
     score than they earned. A heartbeat in localStorage is enough to notice. */
  Exam.lockKey = function(){
    const c = String((this.data && this.data.code) || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
    const st = String((this.student && this.student.id_ref) || this.clientRef || 'anon').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
    return 'cbt-active-' + c + '-' + st;
  };
  Exam.takeSitting = function(){
    try {
      const key = this.lockKey(), now = Date.now();
      const mine = this._sittingId || (this._sittingId = Math.random().toString(36).slice(2) + now.toString(36));
      let held = null;
      try { held = JSON.parse(localStorage.getItem(key) || 'null'); } catch(_) {}
      const alive = held && held.id !== mine && (now - Number(held.at || 0)) < 12000;
      if (alive) return { held: true, by: held.id };
      localStorage.setItem(key, JSON.stringify({ id: mine, at: now }));
      if (this._beat) clearInterval(this._beat);
      this._beat = setInterval(() => { try { localStorage.setItem(key, JSON.stringify({ id: mine, at: Date.now() })); } catch(_) {} }, 4000);
      return { held: false };
    } catch(_) { return { held: false }; }
  };
  Exam.forceSitting = function(){
    try { localStorage.removeItem(this.lockKey()); } catch(_) {}
    this.takeSitting();
    this.load(true);
  };
  Exam.releaseSitting = function(){
    try { if (this._beat) { clearInterval(this._beat); this._beat = null; } } catch(_) {}
    try {
      const key = this.lockKey();
      const held = JSON.parse(localStorage.getItem(key) || 'null');
      if (!held || held.id === this._sittingId) localStorage.removeItem(key);
    } catch(_) {}
  };

  Exam.confirmSubmit = function(){
    const unanswered = this.qs().map((q,i)=>this.answers[i]).filter(a => !this.hasAnswer(a)).length;
    if (unanswered > 0 && !confirm(unanswered + ' question(s) unanswered. Submit anyway?')) return;
    this.submit();
  };

  /* ---------- Lifecycle ---------- */
  Exam.start = function(){
    const code = this.param();
    this.codeEntry(code || '');
  };

  Exam.codeEntry = function(prefill){
    this._identityReady=false;this._pendingCode='';this.root().innerHTML='<div class="card"><h2>📝 Find your examination</h2><p style="margin:0 0 6px;color:var(--sc-primary);font-weight:900">School: '+esc((window.SCHOOL&&SCHOOL.name)||'School')+'</p><p style="color:#64748b">Enter the exam code first. The platform will show the correct identity form for Registered or Open mode.</p><div class="form-group"><label>Exam code *</label><input class="form-input" id="e-code" value="'+esc(prefill)+'" placeholder="e.g. ABC123" autofocus></div><button type="button" class="btn btn-primary" id="e-start">Continue →</button></div>';
    $('e-start').addEventListener('click',()=>Exam.load(false));
  };
  Exam.identityEntry=function(data,code,message){this._pendingCode=code;this._identityReady=true;applySchoolIdentity(data&&data.school||null);const registered=String(data&&data.exam_mode||data&&data.identity_mode||'').toLowerCase()==='registered';
    this.root().innerHTML='<div class="card"><h2>'+(registered?'🪪 Registered student verification':'🌐 Open examination identity')+'</h2><p><b>'+esc(data&&data.title||'Examination')+'</b> · '+esc(data&&data.class||'')+' · '+esc(data&&data.term||'')+' '+esc(data&&data.session||'')+'</p>'+(message?'<div class="notice notice-error">'+esc(message)+(data.error==='wrong_class'?' <br><small>Your class: '+esc(data.student_class||'')+' · Exam class: '+esc(data.exam_class||'')+'</small>':'')+'</div>':'')+(data.error==='wrong_class'?'<div class="notice" style="background:#fef3c7;border-color:#fcd34d;color:#92400e;margin-top:8px"><b>🚫 Class-restricted exam:</b> Registered CBTs can only be taken by students in the assigned class. This attempt is blocked on the server — roster, retake or resitting will not bypass it. Contact your teacher if your class is incorrect.</div>':'')+(registered?'<div class="notice" style="background:#eff6ff;border-color:#93c5fd;color:#1e3a8a">Enter only your admission number. Your official name and class will be loaded from the school register; there is no editable name field.</div><div class="form-group"><label>Admission number *</label><input class="form-input" id="e-admission" placeholder="e.g. GoSA/2024/001" autofocus></div><button class="btn btn-primary" id="e-identity-start">Verify and start exam</button>':'<p>Registered students may enter an admission number to load their official identity. Other candidates can enter a display name.</p><div class="form-group"><label>Admission number (optional)</label><input class="form-input" id="e-admission" placeholder="Registered students only"></div><div class="form-group"><label>Candidate name *</label><input class="form-input" id="e-open-name" placeholder="Your full name"></div><div class="form-group"><label>Class / category (optional)</label><input class="form-input" id="e-open-class" placeholder="e.g. JSS 1A or External"></div><button class="btn btn-primary" id="e-identity-start">Start open exam</button> <button class="btn btn-outline" id="e-guest">Continue anonymously</button>')+' <button class="btn btn-outline" id="e-back-code">Change code</button></div>';
    $('e-identity-start').addEventListener('click',()=>Exam.load(false));if($('e-guest'))$('e-guest').addEventListener('click',()=>Exam.load(true));$('e-back-code').addEventListener('click',()=>Exam.codeEntry(code));
  };

  Exam.load = async function(anon){
    if (!window.sb) {
      this.root().innerHTML = '<div class="card"><div class="notice notice-error">⚠ Database not configured. Open <code>assets/js/config.js</code> and add your Supabase URL and anon key.</div></div>';
      return;
    }
    let code = (($('e-code')||{}).value||this._pendingCode||'').toUpperCase().trim();
    /* V12.60 — LEGACY-LINK SELF-HEAL.
       Old Take-Assignment links, WhatsApp forwards and printed QR codes carry
       the exam UUID instead of the 6-character code. Resolve it to the real
       code here so the candidate never sees "exam_not_found". */
    if (/^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$/.test(code) || /^[0-9A-F]{32}$/.test(code)) {
      try {
        const r = await window.sb.rpc('sc_cbt_resolve_code', { p_ref: code });
        const resolved = String((r && r.data) || '').trim();
        if (resolved) {
          code = resolved.toUpperCase();
          const fld = $('e-code'); if (fld) fld.value = code;
          try { history.replaceState(null, '', '?code=' + encodeURIComponent(code)); } catch (_) {}
          toast('Recovered exam code ' + code + ' from an old link.', 'success', 5000);
        }
      } catch (_) { /* fall through — the server-side v7 getter also resolves ids */ }
    }
    const canonicalCode=code.replace(/[^A-Z0-9]/g,''),admission=(($('e-admission')||{}).value||'').trim();
    let nm=(($('e-open-name')||{}).value||'').trim();if(anon&&!nm)nm='Anonymous-'+Math.random().toString(36).slice(2,7).toUpperCase();
    this.student={name:nm,id_ref:admission,class:(($('e-open-class')||{}).value||'').trim(),anonymous:!!anon};
    if(!code){toast('Enter the exam code.','warning');return;}

    // Network-first with an offline fallback. The former cache-first flow kept a
    // repaired multi-subject exam stale for ten minutes, which made “Repair
    // Tabs” appear ineffective on candidate devices.
    let data = null, error = null, cached = null;
    const cacheKey = 'cbt-exam-cache-' + canonicalCode;
    try {
      const c = JSON.parse(localStorage.getItem(cacheKey) || 'null');
      if (c && (Date.now() - Number(c.at||0)) < 86400000) cached = c.exam;
    } catch (_) {}

    for (let attempt = 0; attempt < 5; attempt++) {
      try {
        const r = await window.sb.rpc('cbt_get_public_exam_v7', { p_code: canonicalCode, p_admission_no: admission });
        data = r.data; error = r.error;
        /* v7 is an optional wrapper — older installs simply do not have it. */
        if (error && /could not find the function|does not exist|schema cache/i.test(String(error.message || error))) {
          const r6 = await window.sb.rpc('cbt_get_public_exam_v6', { p_code: canonicalCode, p_admission_no: admission });
          data = r6.data; error = r6.error;
        }
      } catch (e) { error = e; }
      if (data && !error) break; // includes explicit not-open/not-found diagnostics
      if(error && /cbt_get_public_exam_v6|schema cache|function/i.test(String(error.message||error))) break;
      const wait = Math.min(6000, (400 * Math.pow(2, attempt))) + Math.floor(Math.random() * 500);
      if (attempt < 4) toast('Network busy — retrying (' + (attempt + 1) + '/5)…', 'info', 1500);
      await new Promise(r => setTimeout(r, wait));
    }
    const cachedIsV5=cached&&cached.ok!==false&&String(cached.engine_version||'').startsWith('v5.1');
    if ((!data || error) && cachedIsV5 && !(error&&/cbt_get_public_exam_v6|schema cache|function/i.test(String(error.message||error)))) { data=cached; error=null; toast('Network unavailable — using the latest verified saved exam copy on this device.','warning',5000); }
    if (data && !error && data.ok!==false && !data.wait && !data.closed) {
      try { localStorage.setItem(cacheKey, JSON.stringify({ at: Date.now(), exam: data })); } catch (_) {}
    }

    if (error || !data) {
      const missingRpc=error&&/cbt_get_public_exam_v6|schema cache|function/i.test(String(error.message||error));
      const msg=missingRpc?'The registered/open V5.5 exam reader is not installed in Supabase. The administrator must run database/complete-schema.sql.':('Could not contact the exam service. '+esc(error&&error.message||''));
      this.root().innerHTML = '<div class="card"><div class="notice notice-error"><h2 style="margin-top:0">❌ Exam service unavailable</h2><p>'+msg+'</p><p><b>Code entered:</b> '+esc(code)+'</p></div>' + this.codeEntryHTML(code) + '</div>';
      return;
    }
    if(data&&['admission_required','invalid_admission','not_on_roster','wrong_class'].includes(data.error)){this.identityEntry(data,code,data.error==='admission_required'?'':data.message);return;}
    if(data&&data.ok===true&&String(data.exam_mode||'').toLowerCase()==='open'&&!this._identityReady){this.identityEntry(data,code,'');return;}
    if(data.ok===false && !data.wait && !data.closed){
      const hints={exam_not_found:'Confirm the code in CBT Manager and use Share to copy it.',not_open:'CBT Manager → locate the exam → click Open. Refresh the candidate page afterward.',archived:'Unarchive or recreate this exam.',not_started:'Wait until the configured start time.',closed:'The exam officer must extend the close time or reopen a new attempt.',wrong_class:'This exam is for a different class. Only students in '+esc(data.exam_class||data.class||'the assigned class')+' can take it. Check your class or contact the exam officer.',not_on_roster:'You are not on this exam\'s roster — the exam officer must add your admission number to the roster in CBT Manager.',attempts_exhausted:'You have already taken this CBT ('+(data.taken||'?')+' of '+(data.attempt_limit||'?')+' attempts). Attempt limit reached — contact your teacher to allow a retake if this was a malfunction.'};
      this.root().innerHTML='<div class="card"><div class="notice notice-error"><h2 style="margin-top:0">❌ '+esc(data.message||'Exam unavailable')+'</h2><p><b>Code entered:</b> '+esc(code)+' &nbsp; <b>Matched code:</b> '+esc(data.code||'—')+'</p><p>'+esc(hints[data.error]||'Ask the exam officer to check the exam status and schedule.')+'</p><small>Diagnostic: '+esc(data.error||'unknown')+' · Engine '+esc(data.engine_version||'unknown')+'</small></div>'+this.codeEntryHTML(code)+'</div>';
      return;
    }
    if (data.wait) {
      /* V12.72 (item 4) — a learner should not have to guess when to come back.
         Show the exact opening moment AND a live countdown to it. */
      const _opens = window.fmtDMYT ? fmtDMYT(data.start_at) : new Date(data.start_at).toLocaleString();
      /* V12.81 — the countdown runs on the SERVER's clock. A phone whose clock
         is wrong used to show a countdown that never reached zero (or reached
         it an hour early); the paper still opened on the server's word, so the
         learner saw the two disagree. */
      const _skew = data.server_now ? (new Date(data.server_now).getTime() - Date.now()) : 0;
      const _ms = data.start_at ? (new Date(data.start_at).getTime() - (Date.now() + _skew)) : 0;
      this.root().innerHTML = '<div class="card"><h2>⏳ Not open yet</h2>'
        + '<p>'+esc(data.message||'This exam has not started yet.')+'</p>'
        + '<p>Opens at <strong>'+esc(_opens)+'</strong>'+(data.closes_at?' and closes at <strong>'+esc(window.fmtDMYT?fmtDMYT(data.closes_at):new Date(data.closes_at).toLocaleString())+'</strong>':'')+'.</p>'
        + '<div id="cbt-countdown" style="font-size:1.5rem;font-weight:700;color:#1e3a8a;margin:10px 0">'+this.countdownText(_ms)+'</div>'
        + '<p style="font-size:.88rem;color:#475569">Keep this page open — it will unlock by itself the moment the test opens. Do not reload.</p>'
        + '<button class="btn btn-outline" onclick="Exam.reload()">🔄 Check again now</button></div>';
      this.startCountdown(_ms);
      return;
    }
    if (data.closed) {
      this.root().innerHTML = '<div class="card"><h2>🚫 Closed</h2><p>'+esc(data.message||'This exam is no longer accepting submissions.')+'</p></div>';
      return;
    }
    if(!String(data.engine_version||'').startsWith('v5.1')){
      this.root().innerHTML='<div class="card"><div class="notice notice-error"><h2 style="margin-top:0">⚠️ Exam temporarily unavailable</h2><p>This database is still using an obsolete CBT grading engine that can record incorrect zero marks. The exam has been stopped before you begin.</p><p><strong>Administrator:</strong> back up Supabase, then run the latest <code>database/complete-schema.sql</code>. Confirm the final message says CBT V5.1 is installed, then reload this page.</p></div></div>';
      return;
    }
    if(String(data.exam_mode||'').toLowerCase()==='registered'){
      if(!data.candidate){this.identityEntry(data,code,'Admission number verification is required.');return;}
      this.student={name:data.candidate.full_name,id_ref:data.candidate.admission_no,class:data.candidate.class,id:data.candidate.id,anonymous:false};
    }else if(data.candidate){this.student={name:data.candidate.full_name,id_ref:data.candidate.admission_no,class:data.candidate.class,id:data.candidate.id,anonymous:false};}
    else {if(!this.student.name&&!anon){this.identityEntry(data,code,'Enter a candidate name or choose Continue anonymously.');return;}this.student.name=this.student.name||('Anonymous-'+Math.random().toString(36).slice(2,7).toUpperCase());}
    this.data = data;
    this.school = applySchoolIdentity(data.school || null);
    /* V12.77 — the candidate is part of the seed, so that the sixty questions
       drawn for this student are the SAME sixty on a refresh, on a resume and
       when the paper is re-marked — while another student gets another sixty. */
    this.data._student_id = (this.student && (this.student.id || this.student.id_ref || this.student.name)) || '';
    if (window.CBT && typeof window.CBT.prepareForStudent === 'function') window.CBT.prepareForStudent(this.data);
    if (!this.qs().length) {
      this.root().innerHTML = '<div class="card"><h2>No questions</h2><p>This CBT exam has no valid questions. Ask your teacher to re-upload the CSV question bank. Make sure the CSV has a header row and at least one data row.</p></div>';
      return;
    }
    this.answers = new Array(this.qs().length).fill(null);
    this.flags = {};
    this.flagNotes = {};
    this._done = false;
    this.clientRef = (window.crypto && typeof window.crypto.randomUUID === 'function') ? window.crypto.randomUUID() : ('cbt-'+Date.now()+'-'+Math.random().toString(36).slice(2,10));
    // Restore a recent draft by ORIGINAL question index, so randomisation and
    // multi-subject grouping cannot attach an answer to the wrong question.
    try {
      // V12.37: load draft per student (CODE + admission) first, fallback to legacy CODE only if student matches
      const draftKey = 'cbt-draft-' + String(data.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'') + '-' + String(this.student && this.student.id_ref || 'anon').toUpperCase().replace(/[^A-Z0-9]/g,'');
      let draft = JSON.parse(localStorage.getItem(draftKey) || 'null');
      // Fallback to legacy global draft only if it belongs to same student (check student_ref)
      if (!draft) {
        const legacy = JSON.parse(localStorage.getItem('cbt-draft-' + data.code) || 'null');
        if (legacy && String(legacy.student_ref||'').toUpperCase().replace(/[^A-Z0-9]/g,'') === String(this.student && this.student.id_ref||'').toUpperCase().replace(/[^A-Z0-9]/g,'') && (Date.now() - Number(legacy.t||0)) < 86400000) {
          draft = legacy;
        }
      }
      if (draft && (Date.now() - Number(draft.t||0)) < 86400000) {
        // Only restore if draft's student_ref matches current student (prevent cross-student leakage)
        const draftStudent = String(draft.student_ref||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
        const currStudent = String(this.student && this.student.id_ref||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
        if (draftStudent && currStudent && draftStudent !== currStudent) {
          // Different student, ignore draft (do not restore answers or client_ref)
          console.log('[CBT] Ignoring draft for different student:', draftStudent, 'vs', currStudent);
        } else {
          if (Array.isArray(draft.answers)) {
            const byIndex = new Map(draft.answers.map(x => [Number(x.index), x.answer]));
            this.qs().forEach((q,i) => { const oi=Number(q._orig_index != null?q._orig_index:i); if(byIndex.has(oi)) this.answers[i]=byIndex.get(oi); });
            const wanted=Number(draft.index); const at=this.qs().findIndex((q,i)=>Number(q._orig_index!=null?q._orig_index:i)===wanted); if(at>=0)this.idx=at;
          } else if (Array.isArray(draft.a) && draft.a.length === this.answers.length) { this.answers=draft.a; this.idx=Math.max(0,Math.min(Number(draft.i)||0,this.answers.length-1)); }
          // V12.37: Do NOT restore client_ref from draft of different student (prevents duplicate client_ref score leakage)
          // Only restore client_ref if draft's student matches current
          if (draft.client_ref && (!draftStudent || draftStudent===currStudent)) this.clientRef=String(draft.client_ref);
        }
      }
    } catch(_) {}
    if (data.instructions) {
      if (!confirm('Instructions:\n\n' + data.instructions + '\n\nClick OK to begin. You cannot pause the timer once started.')) {
        this.codeEntry(code);
        return;
      }
    }

    // V12.48: Mandatory proctor permission must finish BEFORE timer/render starts.
    // If a required camera is denied/unavailable, beginMonitor returns false and exam never begins.
    const monitoringReady = await this.beginMonitor();
    if (monitoringReady === false) return;
    /* V12.84 — one sitting per device: a second tab must not run a second clock
       and post a second attempt over the first. */
    const _sitting = this.takeSitting();
    if (_sitting && _sitting.held) {
      this.root().innerHTML = '<div class="card"><div class="notice" style="background:#fffbeb;border-color:#fcd34d;color:#78350f">'
        + '<h2 style="margin-top:0">📱 This paper is already open in another tab</h2>'
        + '<p>Only one tab of this paper can run at a time on this device, so that two clocks cannot send two attempts over each other. '
        + 'Close the other tab and reload this one — or continue here, which will end the sitting in the other tab.</p>'
        + '<button class="btn btn-primary" onclick="Exam.forceSitting()">Continue in this tab</button> '
        + '<button class="btn btn-outline" onclick="location.reload()">Reload</button></div></div>';
      return;
    }
    this.startTs = this.now();
    // Timer starts only after identity, instructions and required proctor permission are complete.
    const _deadlineKey=this.deadlineKey(data.code||canonicalCode);
    /* V12.84 — anchor the whole sitting to the server's clock. */
    this.serverSkew = data.server_now ? (new Date(data.server_now).getTime() - Date.now()) : 0;
    try { localStorage.setItem(_deadlineKey + '-skew', String(this.serverSkew)); } catch(_){}
    const _savedDeadline=Number(localStorage.getItem(_deadlineKey)||0);
    if(_savedDeadline && _savedDeadline>this.now() && _savedDeadline - this.now() < (data.duration||45)*60*1000*2){
      this.deadline=_savedDeadline;
      this.startTs=this.now()-(((data.duration||45)*60*1000)-(this.deadline-this.now()));
    }else{
      this.deadline = this.now() + ((data.duration || 45) * 60 * 1000);
      try{ localStorage.setItem(_deadlineKey, String(this.deadline)); }catch(_){}
    }
    this.remaining = Math.max(0, Math.ceil((this.deadline - this.now()) / 1000));
    this.tick();
    this.render();
  };

  Exam.codeEntryHTML = function(code) {
    return '<div style="margin-top:12px"><a class="btn btn-outline" href="cbt-exam.html">Try a different code</a></div>';
  };

  Exam.beginMonitor = async function(){
    const cfg = (this.data && this.data.anti_cheat_config) || {};
    // V12.45 ENFORCE: If pictoring required and not allowed, BLOCK exam — robust, no bypass
    // Enhanced with face gate, liveness, virtual cam detection, screen share block
    if (window.Proctor && (cfg.camera || cfg.audio_monitor)) {
      try {
        const proctorRes = await Proctor.start(cfg, (this.data && this.data.code) || 'exam', (this.student && this.student.name) || 'candidate', (type, detail) => {
          try {
            this.violationLog = this.violationLog || [];
            this.violationLog.push({ type: type, detail: detail, at: new Date().toISOString() });
            if (type === 'audio_noise') { this.violations = (this.violations || 0) + 1; const v = document.getElementById('viol'); if (v) v.textContent = '⚠ ' + this.violations + ' integrity flag(s)'; }
            if (type === 'proctor_started' && typeof toast === 'function') toast('🔒 Exam monitoring is ON for this assessment: ' + detail + '. Work alone and stay in view of the camera.', 'info', 8000);
            if (type === 'proctor_blocked') { /* Handled via proctorRes.blocked below */ }
          } catch (_) {}
        });
        // V12.50: register one-use server proctor session only AFTER getUserMedia succeeds.
        // cbt_results BEFORE INSERT trigger rejects camera-required submissions with no active session.
        if(cfg.camera===true && proctorRes && !proctorRes.blocked && this.data && this.student){
          let gate=null;
          try{ gate=await window.sb.rpc('cbt_proctor_register',{p_exam_id:this.data.id,p_client_ref:this.clientRef,p_student_id_ref:this.student.id_ref||''}); }catch(e){ gate={error:e}; }
          if(!gate || gate.error || !gate.data || gate.data.ok!==true){
            const why=(gate&&gate.data&&gate.data.error)||(gate&&gate.error&&gate.error.message)||'Proctor registration failed';
            this.root().innerHTML='<div class="card"><div class="notice notice-error"><h2>📸 Exam security could not be verified</h2><p>'+esc(why)+'</p><p>This camera-required exam has not started and no timer has been used. Retry while online or contact the exam officer.</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div></div>';
            try{Proctor.stop();}catch(_){}
            return false;
          }
          this.proctorSessionId=gate.data.session_id;
        }
        // V12.45 ENFORCE: Block exam if pictoring required but declined/blocked
        if(proctorRes && proctorRes.blocked){
          this._proctorBlocked = true;
          // Stop any anti-cheat that may have started, clear timer, show blocking modal
          try{ if(this.monitor) this.monitor.stop(); }catch(_){}
          try{ clearInterval(this.timer); this.timer=null; }catch(_){}
          const retryHtml = '<div style=\"text-align:center;padding:20px\"><div style=\"font-size:3rem;margin-bottom:12px\">📸</div><h2 style=\"color:#991b1b\">Camera Required</h2><p style=\"color:#991b1b;font-weight:600\">'+(proctorRes.reason||'Camera is required for this exam.')+'</p><p style=\"font-size:.85rem;color:#64748b\">This exam was set by your tutor to require picturing to prevent impersonation. You cannot bypass this security.</p><div style=\"display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap\"><button class=\"btn btn-primary\" onclick=\"location.reload()\">🔄 Retry Allow Camera</button><button class=\"btn btn-outline\" onclick=\"history.back()\">← Back</button></div><p style=\"font-size:.75rem;color:#64748b;margin-top:12px\">Tip: When browser asks \'Allow camera?\' choose <b>Allow</b>. If using iPhone, use Safari, not Chrome. Ensure no other app is using camera.</p></div>';
          this.root().innerHTML = '<div class="card">'+retryHtml+'</div>';
          if(typeof toast==='function') toast('📸 Camera required — exam blocked. Allow camera to continue.', 'danger', 10000);
          return false; // V12.48 hard block: caller awaits and must not start timer/exam
        }
      } catch (e) {
        console.warn('[Proctor] start failed:', e.message || e);
        if(cfg.camera===true){
          this.root().innerHTML='<div class="card"><div class="notice notice-error"><h2>📸 Camera Required</h2><p>Camera permission could not be checked. This exam requires camera access. Check your browser/site camera permission, then retry.</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div></div>';
          return false;
        }
      }
      if(cfg.camera===true && (!window.Proctor || !Proctor.active)){
        this.root().innerHTML='<div class="card"><div class="notice notice-error"><h2>📸 Camera Required</h2><p>Monitoring did not start. This exam requires camera access; the exam has not started and no time has been used.</p><button class="btn btn-primary" onclick="location.reload()">Retry after allowing camera</button></div></div>';
        return false;
      }
    }
    if(cfg.camera===true && !window.Proctor){
      this.root().innerHTML='<div class="card"><div class="notice notice-error"><h2>📸 Camera Required</h2><p>The exam requires camera-based proctoring, but the proctoring module did not load. The exam has not started. Refresh the page or contact the exam officer.</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div></div>';
      return false;
    }
    if (window.CBT && typeof window.CBT.startAntiCheat === 'function') {
      this.monitor = window.CBT.startAntiCheat(cfg, (type, n) => this.onViolation(type, n));
    }
    return true;
  };

  /* V12.84 — ONE KEY, ONE PLACE. The deadline used to be stored under a key
     built inline in three different places; a screen that pauses the clock has
     to write the NEW deadline back to the same key, or a reload resurrects the
     old one and charges the candidate for the call. */
  /* the school's clock, not the device's */
  Exam.now = function(){ return Date.now() + (this.serverSkew || 0); };

  Exam.deadlineKey = function(code){
    const c = String(code || (this.data && this.data.code) || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
    const st = String((this.student && this.student.id_ref) || this.clientRef || 'anon').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
    return 'cbt-deadline-' + c + '-' + st;
  };

  /* ---- THE INTERRUPTION POLICY (V12.84) -------------------------------
     A call, a notification, a locked screen or a browser that is put away all
     look the same to a web page: the document becomes hidden and JavaScript is
     throttled or frozen. Two things used to go wrong, and both of them cost the
     candidate the paper they had already answered:

       1. the wall clock kept running while the page was frozen, so the first
          tick after the call found `remaining = 0` and submitted instantly;
       2. every blur was counted as a fresh integrity violation, so a call that
          produced blur + hidden + return could reach `max_violations` and
          submit on its own.

     Now: the clock pauses while the page is away, the time away is given back
     (capped, and logged), at most ONE integrity flag is counted per away
     period, and nothing is ever submitted while the page is not in front of
     the candidate. The interruption log travels with the attempt, so the exam
     officer can see exactly what happened rather than inferring it. */
  /* V12.84 — THE INTEGRITY RECORD, DECIDED IN ONE PLACE.
     A phone call used to fire `window_blur`, then `visibilitychange`, then a
     focus loss on return: three integrity flags for one ring, and at the fifth
     the paper submitted itself. Now at most ONE flag is recorded per away
     period, and nothing escalates to a submission while the page is not in
     front of the candidate — the escalation is held until they come back, so
     it is never a surprise they never saw. */
  Exam.onViolation = function(type, n){
    this.violations = n;
    try { this.violationLog = (this.monitor && this.monitor.log) || this.violationLog || []; } catch(_) {}
    const intr = ['window_blur','tab_switch','visibility_hidden','hidden','blur'];
    if (intr.indexOf(String(type)) >= 0) {
      if (this._awayFlagged) return;
      this._awayFlagged = true;
    }
    const v = document.getElementById('viol');
    if (v) v.textContent = '⚠ ' + n + ' integrity flag(s)';
    const cfg = (this.data && this.data.anti_cheat_config) || {};
    const max = cfg.max_violations || 5;
    if (max && n >= max) {
      if (this.pausedAt || (typeof document !== 'undefined' && document.hidden)) {
        this._pendingSubmit = true;
        toast('Integrity limit reached. Your paper will be sent as soon as you return to this page — nothing has been sent yet.', 'danger', 30000);
        return;
      }
      toast('Too many integrity violations — submitting.', 'danger');
      this.submit();
    }
  };

  Exam.pauseForInterruption = function(why){
    if (this._done || this.pausedAt) return;
    this.pausedAt = Date.now();
    this._awayFlagged = false;
    try { this.saveDraft(); } catch(_) {}
    try { const c = document.getElementById('clock'); if (c) { c.classList.remove('urgent'); c.textContent = '⏸ paused'; } } catch(_) {}
  };

  Exam.resumeFromInterruption = function(){
    if (!this.pausedAt || this._done) { this.pausedAt = 0; return; }
    const away = Math.max(0, Date.now() - this.pausedAt);
    this.pausedAt = 0;
    this._awayFlagged = false;
    /* a learner may not park the paper for a day and come back to a full clock */
    const cap = 30 * 60 * 1000;
    const credit = Math.min(away, cap);
    this.deadline += credit;
    this.interruptTotalMs = (this.interruptTotalMs || 0) + credit;
    (this.interruptLog = this.interruptLog || []).push({ away_ms: away, credited_ms: credit, at: new Date().toISOString() });
    try { localStorage.setItem(this.deadlineKey(), String(this.deadline)); } catch(_) {}
    try { this.saveDraft(); } catch(_) {}
    try {
      if (away > 3000) {
        const left = Math.max(0, Math.ceil((this.deadline - this.now()) / 60000));
        toast('⏸ Your paper was paused while you were away — ' + Math.round(credit / 1000) + 's handed back.'
          + ' ' + left + ' minute(s) left. Your answers are saved on this device.', 'info', 12000);
      }
    } catch(_) {}
    if (this._pendingSubmit && !this._done) {
      this._pendingSubmit = false;
      if (typeof window !== 'undefined' && window.confirm) {
        if (window.confirm('The integrity limit was reached while you were away. Your answers are saved. Send the paper now?')) this.submit();
      } else { this.submit(); }
      return;
    }
    if (!this._timeUpShown) this.tick();
  };

  /* time is up — but the candidate is the one who presses Send */
  Exam.timeUp = function(){
    if (this._done || this._timeUpShown) return;
    this._timeUpShown = true;
    try { this.saveDraft(); } catch(_) {}
    try { localStorage.setItem(this.deadlineKey(), String(Date.now())); } catch(_) {}
    const btn = '<button class="btn btn-primary" style="font-size:1.05rem;padding:14px 22px" id="sc-timeup-send">Send my answers now</button>';
    const t = document.getElementById('clock'); if (t) { t.textContent = '0:00'; t.classList.add('urgent'); }
    const host = this.root();
    if (host) host.insertAdjacentHTML('afterbegin',
      '<div id="sc-timeup" class="card" style="border-left:5px solid #b91c1c;background:#fef2f2;position:sticky;top:0;z-index:60">'
      + '<h3 style="margin:0 0 6px;color:#b91c1c">⏱ Time is up</h3>'
      + '<p style="margin:0 0 10px;color:#7f1d1d;font-size:.9rem">Your answers are saved. Nothing has been sent yet — '
      + 'press the button so the paper is submitted under your name. It will be sent automatically in 2 minutes, or as soon as you come back if you step away.</p>'
      + btn + '</div>');
    const send = () => { try { document.getElementById('sc-timeup').remove(); } catch(_) {} this.submit(); };
    const el = document.getElementById('sc-timeup-send'); if (el) el.addEventListener('click', send);
    /* a visible, attended page submits itself after a grace period; a page that
       is hidden waits — being on a call must never send the paper for you */
    setTimeout(() => { if (this._done || !this._timeUpShown) return; if (document.hidden) return; send(); }, 120000);
  };

  Exam.tick = function(){
    if (this.timer) clearInterval(this.timer);
    const update = () => {
      this.remaining = Math.max(0, Math.ceil((this.deadline - this.now()) / 1000));
      const t = document.getElementById('clock');
      if (t) {
        const m = Math.floor(this.remaining / 60), ss = this.remaining % 60;
        t.textContent = m + ':' + String(ss).padStart(2, '0');
        if (this.remaining <= 60) t.classList.add('urgent');
      }
      if (this.remaining <= 0) {
        clearInterval(this.timer); this.timer = null;
        /* never submit on behalf of a candidate who is not looking at the page */
        if (this.pausedAt || (typeof document !== 'undefined' && document.hidden)) return;
        toast('Time up.', 'warning');
        this.timeUp();
      }
    };
    update();
    this.timer = setInterval(update, 1000);
  };

  Exam.submit = async function(){
    if (this._done) return;

    try { this.releaseSitting(); } catch(_) {}   /* the sitting is over: free the device */

    try { if (window.CBTSpeech) CBTSpeech.stop(); } catch(_) {}   /* V10.8: audio never outlives the exam */
    if (this.monitor) try { this.monitor.stop(); } catch (e) {}
    if (window.Proctor && Proctor.active) try { Proctor.stop(); } catch (e) {}
    const graded = (window.CBT && window.CBT.gradeSubmission) ? window.CBT.gradeSubmission(this.data, this.answers) : { score: 0, total: 0, percent: 0, grade: 'F', correct: 0, wrong: 0, skipped: 0 };
    /* V12.84 — the same clock that set the deadline measures the time taken. */
    const timeTaken = Math.round((this.now() - this.startTs) / 1000);
    const payload = {
      exam_id: this.data.id,
      student_id: this.student.id || null,
      student_name: this.student.name,
      student_class: this.student.class,
      student_id_ref: this.student.id_ref,
      student_type: this.data.exam_mode,
      client_ref: this.clientRef,
      client_engine: 'v5.1',
      // Client grading is only a resilience preview. The canonical RPC ignores
      // these values and re-grades against the private server-side answer key.
      score: graded.score, total: graded.total, percent: graded.percent,
      correct_count: graded.correct, wrong_count: graded.wrong, skipped_count: graded.skipped,
      time_taken: timeTaken, violations: this.violations || 0, violation_log: this.violationLog || [],
      /* V12.84 — what the connection and the phone did to this sitting travels
         with the attempt: how long the page was away, how much was credited
         back, and how many interruptions there were. A tutor marking a paper
         that was paused for a call can see it instead of guessing. */
      interruptions: (this.interruptLog || []).length,

      interruption_log: (this.interruptLog || []).slice(-20),

        .filter(k => this.flags[k])

  // ENTERPRISE V8: flush any queued (failed) submissions from a previous session
  /* Flush any queued (failed) submissions from a previous session */
  (async function flushPending() {
    try {
      const q = JSON.parse(localStorage.getItem('cbt-pending-queue') || '[]');
      if (q.length && window.sb) {
        const rest = [];
        for (const p of q) {
          try {
            let r=null; try{ r = await window.sb.rpc('cbt_submit_with_wal', { p_payload: Object.assign({client_engine:'v5.5'},p) }); if(r.error) throw r.error; }catch(_){ r = await window.sb.rpc('cbt_submit_v6', { p_payload: Object.assign({client_engine:'v5.5'},p) }); }
            if (!(r && !r.error && r.data && r.data.saved && String(r.data.engine_version||'').startsWith('v5.1'))) rest.push(p);
          } catch (_) { rest.push(p); }
        }
        localStorage.setItem('cbt-pending-queue', JSON.stringify(rest));
        if (q.length !== rest.length) {
          const msg = (q.length - rest.length) + ' queued submission(s) delivered.';
          if (window.toast) window.toast(msg, 'success');
        }
      }

  })();

  // V12.33 draft persistence on browser close (expert fix 4g)
  window.addEventListener('beforeunload', ()=>{ try{ Exam.saveDraft(); if(Exam.deadline){ try{ localStorage.setItem(Exam.deadlineKey(), String(Exam.deadline)); }catch(_){} } }catch(_){} });
  /* V12.84 — THE PHONE CALL.
     `visibilitychange` is the only signal every mobile browser gives reliably
     for "a call came in", "the screen locked", "the candidate switched apps".
     It is also fired by a plain tab switch, so it is treated as an
     INTERRUPTION (pause the clock, save the answers, hand the time back), never
     as a reason to submit. The integrity monitor still records one flag per
     away period — see beginMonitor — so the record is honest without the paper
     being taken away from a candidate whose phone simply rang. */
  document.addEventListener('visibilitychange', ()=>{
    try {
      if (!Exam.data || Exam._done) return;
      if (document.hidden) Exam.pauseForInterruption('hidden');
      else Exam.resumeFromInterruption();
    } catch(_) {}
  });
  window.addEventListener('pagehide', ()=>{ try { if (Exam.data && !Exam._done) Exam.pauseForInterruption('pagehide'); } catch(_) {} });
  window.addEventListener('pageshow', (e)=>{ try { if (Exam.data && !Exam._done && Exam.pausedAt) Exam.resumeFromInterruption(); } catch(_) {} });
  window.addEventListener('focus', ()=>{ try { if (!document.hidden && Exam.pausedAt) Exam.resumeFromInterruption(); } catch(_) {} });

  /* ===================================================================
     V12.85 (round 30, item 4) — THE SIGNAL DROPS IN THE MIDDLE OF THE PAPER.
     -------------------------------------------------------------------
     A learner sitting a prep paper at home on mobile data does not lose their
     answers when the network goes — the draft is written to the device on every
     change — but until now nothing on the screen told them that, and the clock
     kept counting from a `serverSkew` measured when the paper loaded. Two
     minutes of a dead connection could therefore leave the countdown quietly
     wrong, and a learner who reconnected was never told the paper had closed
     while they were away.

     This adds the missing half of the story:
       · an OFFLINE banner, spoken in plain words, that says the answers are
         safe on this device and nothing has been lost;
       · an ONLINE recovery path that asks the DATABASE for the truth
         (sc_cbt_window_state: server time, seconds left, open/expired) and
         re-bases the countdown on it — the phone's clock is never trusted;
       · a re-flush of anything queued for sending (SCNet), so a submission
         that failed on a dead connection goes out by itself;
       · an honest ending: if the paper closed while the connection was down,
         the learner is shown the same "time is up — send my answers" door they
         would have seen had they been connected. Nothing is submitted silently.
     =================================================================== */
  Exam.netBanner = function (state, msg) {
    let el = document.getElementById('sc-net-banner');
    if (state === 'ok') { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.id = 'sc-net-banner';
      el.style.cssText = 'position:sticky;top:0;z-index:70;padding:10px 14px;font-size:.9rem;'
        + 'border-left:5px solid ' + (state === 'off' ? '#b91c1c' : '#0369a1') + ';'
        + 'background:' + (state === 'off' ? '#fef2f2' : '#eff6ff') + ';margin-bottom:8px';
      const host = (this.root && this.root()) || document.body;
      try { host.insertBefore(el, host.firstChild); } catch (_) { document.body.insertBefore(el, document.body.firstChild); }
    }
    el.textContent = msg;
  };
  Exam.netState = function () {
    const nav = (typeof navigator !== 'undefined') ? navigator : {};
    const c = nav.connection || nav.mozConnection || nav.webkitConnection || null;
    /* navigator.onLine === false is trustworthy; === true only means "there is an
       interface", so it is never used to promise the server is reachable. */
    return { online: nav.onLine !== false, type: c && c.effectiveType ? String(c.effectiveType) : '', down: c && c.downlink ? Number(c.downlink) : null };
  };
  Exam.resyncClock = async function () {
    if (!this.data || this._done || !this.data.id) return null;
    const st = this.netState();
    if (!st.online) return null;
    let state = null;
    try {
      const r = await window.sb.rpc('sc_cbt_window_state', { p_exam_id: this.data.id });
      if (r && !r.error && r.data) state = r.data;
    } catch (_) { return null; }
    if (!state) return null;
    /* re-base the clock on the database's own instant */
    if (state.server_now) {
      this.serverSkew = new Date(state.server_now).getTime() - Date.now();
      try { localStorage.setItem(this.deadlineKey() + '-skew', String(this.serverSkew)); } catch (_) {}
    }
    if (state.state === 'expired' || state.state === 'closed' || state.state === 'archived') {
      this.netBanner('off', '⛔ This paper closed while your connection was down ('
        + (state.message || 'the school closed it') + '). Your answers are still on this device — send them now and your tutor will see them.');
      if (typeof this.timeUp === 'function') { try { this.timeUp(); } catch (_) {} }
      return state;
    }
    /* still open: the countdown is re-based, and a queued submission is retried */
    try { if (this.deadline) { this.deadline = this.now() + Math.max(0, Number(state.seconds_left || 0)) * 1000; this.tick(); } } catch (_) {}
    try {
      if (window.SCNet && SCNet.flush) {
        SCNet.flush(window.sb, async function (item, sb) {
          let r = null;
          try { r = await sb.rpc('cbt_submit_with_wal', { p_payload: item.payload }); if (r.error) throw r.error; }
          catch (_) { r = await sb.rpc('cbt_submit_v6', { p_payload: item.payload }); if (r.error) throw r.error; }
          return (r && r.data) || null;
        });
      }
    } catch (_) {}
    this.netBanner('ok');
    return state;
  };
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('offline', () => {
      try {
        if (!Exam.data || Exam._done) return;
        Exam.netBanner('off', '📴 You are offline. Your answers are being saved on THIS device after every question, '
          + 'so nothing is lost. The clock shown is school time and will be corrected the moment you reconnect — '
          + 'do not close this tab.');
      } catch (_) {}
    });
    window.addEventListener('online', () => {
      try {
        if (!Exam.data || Exam._done) return;
        Exam.netBanner('on', '📶 Back online — checking the school clock and sending anything that was waiting…');
        Exam.resyncClock();
      } catch (_) {}
    });
    /* a connection that changes shape (4G → 2G → no service) without ever going
       "offline" is the common case on a phone; watch the hint too */
    try {
      const nav = navigator;
      const c = nav.connection || nav.mozConnection || nav.webkitConnection;
      if (c && c.addEventListener) c.addEventListener('change', () => {
        try { if (Exam.data && !Exam._done && Exam.netState().online) Exam.resyncClock(); } catch (_) {}
        try {
          if (Exam.data && !Exam._done && String(c.effectiveType || '').indexOf('2g') === 0) {
            Exam.netBanner('on', '🐢 The network is slow (' + c.effectiveType + '). Your answers are saved on this device as you type — '
              + 'send as soon as you can, and keep this tab open.');
          }
        } catch (_) {}
      });
    } catch (_) {}
    /* and one silent re-check when the learner comes back to the tab */
    document.addEventListener('visibilitychange', () => {
      try { if (!document.hidden && Exam.data && !Exam._done) Exam.resyncClock(); } catch (_) {}
    });
  }

  // Exposed for accessibility tooling, automated regression tests and the
  // manager's safe preview—not for grading (grading remains server-authoritative).
  window.Exam = Exam;

  // Start the exam
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => Exam.start());
  else Exam.start();
})();
</script>
