# ============================================================
# Supabase Auto-Restore Watchdog — Layer 10 (V8.9)
# ------------------------------------------------------------
# The last line of defence. Every keep-alive layer PREVENTS the
# pause; this workflow UNDOES it automatically if it ever happens
# anyway (e.g. every pinger failed in the same week).
#
# Daily, it asks the Supabase Management API for the project's
# status. If the project is INACTIVE (paused), it calls the
# official restore endpoint — the same thing the "Restore
# project" button in the dashboard does — waits for the project
# to come back, then writes a heartbeat so the timer restarts.
#
# ONE-TIME SETUP (2 minutes) — two repository secrets
# (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  a Personal Access Token (starts with sbp_)
#                          from https://supabase.com/dashboard/account/tokens
#                          → "Generate new token", name it e.g. auto-restore
#   SUPABASE_PROJECT_REF   the 20-character code from your dashboard URL:
#                          https://supabase.com/dashboard/project/THIS-PART
#
# ⚠️ The access token manages your WHOLE Supabase account — store it
#    ONLY as a GitHub secret, never in code or config files.
# If the secrets are not set, the workflow skips gracefully with a
# notice (safe default for repos that don't want this layer).
# ============================================================
name: Supabase Auto-Restore Watchdog

on:
  schedule:
    # 05:43 UTC every day
    - cron: '43 5 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check project status and auto-restore if paused
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Auto-restore watchdog is not activated. Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets to enable it (see SUPABASE_FREE_TIER_PROTECTION.md — Layer 10)."
            exit 0
          fi

          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"
          status=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status","UNKNOWN"))' 2>/dev/null || echo UNKNOWN)
          echo "Project status: $status"

          case "$status" in
            ACTIVE_HEALTHY|COMING_UP|RESTORING)
              echo "✅ Project is up (status: $status). Nothing to do."
              ;;
            INACTIVE|PAUSING|PAUSED)
              echo "::warning::Project is paused (status: $status). Requesting automatic restore now…"
              code=$(curl -s -o /tmp/restore.txt -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                "$api/restore" -d '{}')
              echo "Restore request → HTTP $code: $(cat /tmp/restore.txt)"
              if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
                echo "::error::Restore request failed (HTTP $code). Restore the project manually at https://supabase.com/dashboard/project/$SUPABASE_PROJECT_REF"
                exit 1
              fi
              # Poll up to ~10 minutes for the project to come back up
              for i in $(seq 1 40); do
                sleep 15
                status=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status","UNKNOWN"))' 2>/dev/null || echo UNKNOWN)
                echo "  poll $i/40 → $status"
                [ "$status" = "ACTIVE_HEALTHY" ] && break
              done
              if [ "$status" = "ACTIVE_HEALTHY" ]; then
                echo "✅ Project restored automatically and is healthy again."
              else
                echo "::warning::Restore was accepted but the project is not ACTIVE_HEALTHY yet (last status: $status). It usually finishes within a few more minutes — check the dashboard if this repeats tomorrow."
              fi
              ;;
            *)
              echo "::warning::Unrecognised status '$status'. Verify SUPABASE_PROJECT_REF and that the access token is valid (https://supabase.com/dashboard/account/tokens)."
              ;;
          esac

          # After any successful check/restore, write a heartbeat so the
          # inactivity timer restarts from zero (only if Layer-2 secrets exist).
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] && { [ "$status" = "ACTIVE_HEALTHY" ] || [ "$status" = "COMING_UP" ]; }; then
            hb=$(curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/sc_keep_alive" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" -d '{"src":"auto-restore-watchdog"}' || true)
            echo "Heartbeat: $hb"
          fi
